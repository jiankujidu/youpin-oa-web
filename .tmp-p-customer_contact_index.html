	<title>优品OA</title>		


	<meta name="keywords" content="优品OA"/>
	<meta name="description" content="优品办公是一款基于ThinkPHP6 + Layui + MySql打造的，简单实用的开源免费的企业办公系统框架。系统集成了系统设置、人事管理、消息管理、审批管理、日常办公、客户管理、合同管理、项目管理、财务管理、知识管理、产品管理、附件管理等模块。系统简约，易于功能扩展，方便二次开发，让开发者更专注于业务深度需求的开发，帮助开发者简单高效降低二次开发成本，通过二次开发之后可以用来做CRM，ERP，业务管理等系统。"/>

<script>

</script>

<body class="main-body">
	<!-- 主体 -->
	
<div class="p-3">
	<form class="layui-form gg-form-bar border-x border-t" lay-filter="barsearchform">
		<div class="layui-input-inline" style="width:300px;">
			<input type="text" name="keywords" placeholder="输入关键字" class="layui-input" autocomplete="off" />
		</div>
		<div class="layui-input-inline" style="width:150px;">
			<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform"><i class="layui-icon layui-icon-search mr-1"></i>搜索</button>
			<button type="reset" class="layui-btn layui-btn-reset" lay-filter="reset">清空</button>
		</div>
	</form>
    <table class="layui-hide" id="test" lay-filter="test"></table>
</div>

	<!-- /主体 -->

	<!-- 底部 -->
	
	<!-- /底部 -->
	
	<!-- 脚本 -->
	
	<script>
	const moduleInit = ['tool','tablePlus'];
	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool, form = layui.form;
		layui.pageTable = table.render({
			elem: '#test'
			,toolbar: '#toolbarDemo'
			,title:'联系人列表'
			,url: "/customer/contact/index"
			,cellMinWidth: 80
			,page: true //开启分页
			,is_excel:true
			,limit: 20
			,height: 'full-82'
			,cols: [[
					{field:'id',width:80, title: 'ID号', align:'center'}
					,{field:'name',width:100,title: '联系人姓名', align:'center'}
					,{field:'customer',title: '	成交客户'}
					,{field:'status', title: '性别',width:80,align:'center',templet: function(d){
						var html='未知';
						var html1='<span class="green">男</span>';
						var html2='<span class="blue">女</span>';
						if(d.sex==1){
							return html1;
						}
						if(d.sex==2){
							return html2;
						}
						else{
							return html;
						}
					}}
					,{field:'mobile',width:100,title: '联系方式', align:'center',
						templet: function(d) {
							// 判断是否为图片地址
							if (d.mobile) {
								// 检查是否是图片格式（支持常见图片格式）
								if (d.mobile.match(/\.(jpg|jpeg|png|gif|bmp|webp|svg)(\?.*)?$/i)) {
									// 返回可点击预览的图片
									return '<div style="cursor:pointer;" onclick="previewImage(\'' + d.mobile + '\', \'' + ('联系方式') + '\')">' +
										'<img src="' + d.mobile + '" style="width:30px;height:30px;border-radius:4px;object-fit:cover;" title="点击预览">' +
										'</div>';
								}
							}
							// 非图片时显示文本（空值处理）
							return d.mobile || '<span style="color:#999;">-</span>';
						}}
					,{field:'qq',width:100,title: 'QQ号码', align:'center',
						templet: function(d) {
							// 判断是否为图片地址
							if (d.qq) {
								// 检查是否是图片格式（支持常见图片格式）
								if (d.qq.match(/\.(jpg|jpeg|png|gif|bmp|webp|svg)(\?.*)?$/i)) {
									// 返回可点击预览的图片
									return '<div style="cursor:pointer;" onclick="previewImage(\'' + d.qq + '\', \'' + ('QQ') + '\')">' +
										'<img src="' + d.qq + '" style="width:30px;height:30px;border-radius:4px;object-fit:cover;" title="点击预览">' +
										'</div>';
								}
							}
							// 非图片时显示文本（空值处理）
							return d.qq || '<span style="color:#999;">-</span>';
						}}
					,{
						field: 'wechat',
						title: '微信号码',
						align: 'center',
						width: 100,
						templet: function(d) {
							// 判断是否为图片地址
							if (d.wechat) {
								// 检查是否是图片格式（支持常见图片格式）
								if (d.wechat.match(/\.(jpg|jpeg|png|gif|bmp|webp|svg)(\?.*)?$/i)) {
									// 返回可点击预览的图片
									return '<div style="cursor:pointer;" onclick="previewImage(\'' + d.wechat + '\', \'' + ('微信') + '\')">' +
										'<img src="' + d.wechat + '" style="width:30px;height:30px;border-radius:4px;object-fit:cover;" title="点击预览">' +
										'</div>';
								}
							}
							// 非图片时显示文本（空值处理）
							return d.wechat || '<span style="color:#999;">-</span>';
						}
					}
					,{field:'email',width:120,title: '电子邮箱', align:'center'}
					,{field:'position',width:120,title: '担任职位', align:'center'}
					,{field:'department',width:120,title: '部门', align:'center'}
					,{fixed:'right',width:100,title: '操作', align:'center',templet: function(d){
						var html = '<div class="layui-btn-group">';
						var btn='<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>';
						var btn1='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
						return html+btn+btn1+'</div>';
					}}
				]]
			});
			
			table.on('tool(test)',function (obj) {
				if(obj.event === 'edit'){
					let url = '/customer/contact/contact_add/id/'+obj.data.id;
					tool.side(url);
				}
				if(obj.event === 'del'){
					layer.confirm('确定要删除该联系人吗?', {icon: 3, title:'提示'}, function(index){
						let callback = function (e) {
							layer.msg(e.msg);
							if (e.code == 0) {
								layui.pageTable.reload();
							}
						}
						tool.delete("/customer/contact/contact_del", { id: obj.data.id}, callback);
						layer.close(index);
					});
				}
			});
			
			//监听搜索提交
			form.on('submit(webform)', function(data) {
				layui.pageTable.reload({
					where: {
						keywords: data.field.keywords
					},
					page: {
						curr: 1
					}
				});
				return false;
			});
		}
	</script>

	<!-- /脚本 -->
	<script src="/static/assets/layui/layui.js"></script>
	<script src="/static/assets/gougu/gouguInit.js"></script>
	<script type="text/javascript">
		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content = 
					`width=${pcWidth}, initial-scale=${scale}, minimum-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
			});
		})();
		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
	<!-- 统计代码 -->
	
	<!-- /统计代码 -->
</body>
</html>
