<script>
	var checkboxArr = []
	const moduleInit = ['tool','employeepicker','tablePlus','laydatePlus'];

	// 显示手机扫码拨打二维码弹窗
    window.showPhoneQRCode = function(phoneNumber, customerName) {
        // 清理号码
        var cleanNumber = phoneNumber.replace(/\D/g, '');
        if(!cleanNumber || cleanNumber.length < 8) {
            layer.msg('电话号码格式不正确');
            return;
        }
        
        // 创建弹窗内容
        var modalHtml = '<div class="phone-qr-modal">' +
            '<div class="qr-title">扫码拨打客户电话</div>' +
            '<div>客户：<strong>' + (customerName || '未知') + '</strong></div>' +
            '<div class="qr-phone-number">📱 ' + formatPhoneNumber(phoneNumber) + '</div>' +
            '<div class="qr-container">' +
            '<div id="qrcode-container"></div>' +
            '</div>' +
            '<div class="qr-tips">' +
            '<p>请使用手机扫描二维码，自动跳转到拨号页面</p>' +
            '<p>支持微信、支付宝、浏览器等扫码功能</p>' +
            '</div>' +
            '<div class="steps-container">' +
            '<div class="step-item">' +
            '<div class="step-number">1</div>' +
            '手机扫码' +
            '</div>' +
            '<div class="step-item">' +
            '<div class="step-number">2</div>' +
            '跳转拨号' +
            '</div>' +
            '<div class="step-item">' +
            '<div class="step-number">3</div>' +
            '确认拨打' +
            '</div>' +
            '</div>' +
            '</div>';
        
        // 显示弹窗
        var index = layer.open({
            type: 1,
            title: '扫码拨打电话',
            area: ['500px', '600px'],
            content: modalHtml,
            success: function(layero, index) {
                // 生成二维码
                generateQRCode(cleanNumber);
            }
        });
    };
    
    // 生成包含动态电话号码的URL
	function generateQRCode(phoneNumber) {
		// 创建一个中间页面URL，带电话号码参数
		var baseUrl = window.location.origin; // 获取当前网站域名
		var redirectUrl = baseUrl + '/phone/call.html?phone=' + phoneNumber;
		var telUrl = 'tel:' + phoneNumber;
		
		var qrcodeElement = document.getElementById('qrcode-container');
		if(qrcodeElement) {
			qrcodeElement.innerHTML = '';
			
			// 生成二维码（指向中间页面）
			new QRCode(qrcodeElement, {
				text: redirectUrl,
				width: 200,
				height: 200,
				colorDark: "#000000",
				colorLight: "#ffffff",
				correctLevel: QRCode.CorrectLevel.H
			});
			
			// 在弹窗中添加说明
			var tipsDiv = document.createElement('div');
			tipsDiv.innerHTML = '<p style="margin-top:10px;font-size:12px;color:#666;">二维码指向跳转页面，扫码后自动拨打</p>';
			qrcodeElement.appendChild(tipsDiv);
		}
	}
    
    // 下载二维码图片
    function downloadQRCodeImage(phoneNumber) {
        var canvas = document.querySelector('#qrcode-container canvas');
        if(canvas) {
            var link = document.createElement('a');
            link.download = '拨打-' + phoneNumber + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } else {
            layer.msg('无法下载二维码');
        }
    }
    
    // 格式化电话号码显示
    function formatPhoneNumber(phoneNumber) {
        var cleanNumber = phoneNumber.replace(/\D/g, '');
        if(cleanNumber.length === 11) {
            // 手机号：3-4-4 格式
            return cleanNumber.replace(/(\d{3})(\d{4})(\d{4})/, '$1 $2 $3');
        } else if(cleanNumber.length === 12) {
            // 带区号的固话：4-4-4 格式
            return cleanNumber.replace(/(\d{4})(\d{4})(\d{4})/, '$1 $2 $3');
        } else if(cleanNumber.length === 10) {
            // 固话：3-3-4 格式
            return cleanNumber.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
        }
        // 其他格式保持原样
        return phoneNumber;
    }

	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool ,form = layui.form, element = layui.element,upload  = layui.upload,laydate = layui.laydate, employeepicker = layui.employeepicker,laydatePlus = layui.laydatePlus,dropdown=layui.dropdown,laytpl=layui.laytpl;

		// 解码并解析数据
		function safeJsonParse(jsonString) {
			try {
				// 先替换所有特殊字符
				jsonString = jsonString
					.replace(/&quot;/g, '"')
					.replace(/\n/g, '\\n')
					.replace(/\r/g, '\\r')
					.replace(/\t/g, '\\t')
					.replace(/\\"/g, '\\"');
				return JSON.parse(jsonString);
			} catch (error) {
				// 尝试移除非法字符
				jsonString = jsonString.replace(/[\u0000-\u001F\u007F-\u009F]/g, '');
				try {
					return JSON.parse(jsonString);
				} catch (e) {
					console.error('二次解析失败:', e);
					return [];
				}
			}
		}

		// 创建多选组件的通用函数
        function createMultiSelect(elementId, hiddenElementId, tips, data, propName, propValue) {
            return xmSelect.render({
                el: '#' + elementId,
                toolbar: {
                    show: true,
                    list: ['ALL', 'CLEAR']
                },
                tips: tips,
                filterable: true,
                height: 'auto',
                prop: {
                    name: propName || 'title',
                    value: propValue || 'id'
                },
                on: function(data) {
                    var arr = data.arr;
                    var value = '';
                    for(var i = 0; i < arr.length; i++) {
                        value = value + arr[i][propValue || 'id'] + ',';
                    }
                    document.getElementById(hiddenElementId).value = value;
                },
                data: data
            });
        }

		// 创建多选组件的通用函数
		function createTreeMultiSelect(elementId, hiddenElementId, tips, data, propName, propValue, propChildrene) {
			return xmSelect.render({
				el: '#' + elementId,
				toolbar: {
					show: true,
					list: ['ALL', 'CLEAR']
				},
				tips: tips,
				filterable: true,
				tree: {
					show: true, // 启用树状结构
					strict: false, // 非严格父子模式
					expandedKeys: false, // 默认展开所有节点
				},
				height: 'auto',
				prop: {
					name: propName || 'title',
					value: propValue || 'id',
					children: propChildrene || 'children' // 指定子节点字段
				},
				on: function(data) {
					var arr = data.arr;
					var value = '';
					for(var i = 0; i < arr.length; i++) {
						value = value + arr[i][propValue || 'id'] + ',';
					}
					document.getElementById(hiddenElementId).value = value;
				},
				data: data
			});
		}
		
		// var follow_time = new laydatePlus({'target':'follow_time'});
		var remark_time = new laydatePlus({'target':'remark_time'});

		function showBatchReplaceModal() {
			if (checkboxArr.length <= 0) {
				layer.msg('请至少选择一个客户');
				return;
			}
			
			// 获取选中客户的数据
			var tableId = 'test';
			var checkStatus = table.checkStatus(tableId);
			var selectedData = checkStatus.data;
			
			// 如果没有选中的数据，尝试从checkboxArr中获取
			if (selectedData.length === 0 && checkboxArr.length > 0) {
				// 我们可以通过表格缓存来获取数据
				selectedData = [];
				var tableCache = layui.table.cache[tableId];
				tableCache.forEach(function(item) {
					if (checkboxArr.includes(item.id)) {
						selectedData.push(item);
					}
				});
			}
			
			if (selectedData.length === 0) {
				layer.msg('无法获取客户数据，请重新选择');

			}
			
			// 显示弹窗
			var modalHtml = $('#batchReplaceModal').html();
			var index = layer.open({
				type: 1,
				title: '批量修改客户名称 - 已选择' + selectedData.length + '个客户',
				area: ['800px', '85%'],
				content: modalHtml,
				success: function(layero, index) {
					// 渲染选中的客户列表
					renderSelectedCustomers(selectedData);
					
					// 监听模式切换
					form.on('radio(modeChange)', function(data){
						if(data.value === 'replace') {
							$('#replaceModeContent').show();
							$('#prefixModeContent').hide();
						} else {
							$('#replaceModeContent').hide();
							$('#prefixModeContent').show();
						}
					});
					
					// 监听预览按钮
					$('#previewBtn').off('click').on('click', function() {
						showReplacePreview(selectedData);
					});
					
					// 监听确认替换按钮
					$('#confirmReplace').off('click').on('click', function() {
						confirmReplaceOperation(selectedData, index);
					});
					
					// 监听输入框变化，实时预览（仅限替换模式）
					$('#searchText, #replaceText, #prefixText').on('input', function() {

								showReplacePreview(selectedData);
							}
						}

				}

		// 显示替换预览
		function showReplacePreview(customers) {
			var currentMode = $('input[name="replaceMode"]:checked').val();
			var previewContainer = $('#replacePreview');
			var previewSection = $('#previewSection');
			var confirmBtn = $('#confirmReplace');
			
			previewContainer.empty();
			
			var hasChanges = false;
			var previewHtml = '';
			
			customers.forEach(function(customer) {
				var oldName = customer.name;
				var newName = oldName;
				
				if (currentMode === 'replace') {
					// 替换模式
					var searchText = $('#searchText').val().trim();
					var replaceText = $('#replaceText').val().trim();
					
					if (!searchText) {
						layer.msg('请输入要查找的内容');
						return;
					}
					
					if (oldName.includes(searchText)) {
						newName = oldName.replace(new RegExp(searchText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), replaceText);
						hasChanges = true;
						
						previewHtml += '<div class="preview-item">' +
									'<span class="old-name">' + oldName + '</span>' +
									'→' +
									'<span class="new-name">' + newName + '</span>' +
									'</div>';
					} else {
						previewHtml += '<div class="preview-item no-change">' +
									'<span class="old-name">' + oldName + '</span>' +
									'→' +
									'<span class="new-name">(无变化)</span>' +
									'</div>';
					}
				} else {
					// 新增前文字模式
					var prefixText = $('#prefixText').val().trim();
					
					if (!prefixText) {
						layer.msg('请输入要添加的前文字');
						return;
					}
					
					// 如果已经包含此前缀，则跳过
					if (oldName.startsWith(prefixText)) {
						previewHtml += '<div class="preview-item no-change">' +
									'<span class="old-name">' + oldName + '</span>' +
									'→' +
									'<span class="new-name">(已包含此前缀)</span>' +
									'</div>';
					} else {
						newName = prefixText + oldName;
						hasChanges = true;
						
						previewHtml += '<div class="preview-item">' +
									'<span class="old-name">' + oldName + '</span>' +
									'→' +
									'<span class="new-name">' + newName + '</span>' +
									'</div>';
					}
				}
			});
			
			previewContainer.html(previewHtml);
			previewSection.show();
			
			if (hasChanges) {
				confirmBtn.show();
				layer.msg('预览完成，请确认修改');
			} else {
				confirmBtn.hide();
				var msg = currentMode === 'replace' ? '未找到匹配的内容' : '所有客户都已包含此前缀或无变化';
				layer.msg(msg);
			}
		}
		
		// 确认替换操作
		function confirmReplaceOperation(customers, modalIndex) {
			var currentMode = $('input[name="replaceMode"]:checked').val();
			var changeCount = 0;
			var changeList = [];
			
			customers.forEach(function(customer) {
				var oldName = customer.name;
				var newName = oldName;
				
				if (currentMode === 'replace') {
					// 替换模式
					var searchText = $('#searchText').val().trim();
					var replaceText = $('#replaceText').val().trim();
					
					if (!searchText) {
						layer.msg('请输入要查找的内容');
						return;
					}
					
					if (oldName.includes(searchText)) {
						newName = oldName.replace(new RegExp(searchText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), replaceText);
						changeCount++;
						changeList.push({
							id: customer.id,
							oldName: oldName,
							newName: newName
						});
					}
				} else {
					// 新增前文字模式
					var prefixText = $('#prefixText').val().trim();
					
					if (!prefixText) {
						layer.msg('请输入要添加的前文字');
						return;
					}
					
					// 如果还没有此前缀，则添加
					if (!oldName.startsWith(prefixText)) {
						newName = prefixText + oldName;
						changeCount++;
						changeList.push({
							id: customer.id,
							oldName: oldName,
							newName: newName
						});
					}
				}
			});
			
			if (changeCount === 0) {
				var msg = currentMode === 'replace' ? '没有需要修改的客户' : '没有客户需要添加此前缀';
				layer.msg(msg);
				return;
			}
			
			// 显示最终确认弹窗
			var modeTitle = currentMode === 'replace' ? '批量替换' : '批量添加前缀';
			var confirmHtml = '<div class="p-3">' +
							'<p><i class="layui-icon layui-icon-about" style="color: #FFB800; font-size: 18px;"></i> ' + 
							(currentMode === 'replace' ? '即将替换 ' : '即将为 ') + changeCount + ' 个客户的名称</p>' +
							'<div style="max-height: 200px; overflow-y: auto; margin: 15px 0; padding: 10px; border: 1px solid #eee; background: #fafafa;">';
			
			// 显示前5个修改示例
			var showCount = Math.min(5, changeList.length);
			for (var i = 0; i < showCount; i++) {
				var item = changeList[i];
				confirmHtml += '<div style="margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee;">' +
							'<div><span style="color: #666;">修改前：</span>' + item.oldName + '</div>' +
							'<div><span style="color: #5FB878;">修改后：</span>' + item.newName + '</div>' +
							'</div>';
			}
			
			if (changeList.length > showCount) {
				confirmHtml += '<div style="text-align: center; color: #999; padding: 10px;">... 还有 ' + (changeList.length - showCount) + ' 个客户</div>';
			}
			
			confirmHtml += '</div>' +
						'<p style="color: #666;">确认执行批量修改吗？此操作不可逆。</p>' +
						'</div>';
			
			layer.confirm(confirmHtml, {
				title: '确认' + modeTitle,
				area: ['450px', '400px'],
				btn: ['确认修改', '取消']
			}, function(confirmIndex) {
				// 关闭确认窗口
				layer.close(confirmIndex);
				
				// 执行批量更新
				executeBatchReplace(changeList, modalIndex);
			}, function() {
				// 用户取消
			});
		}
		
		// 执行批量替换
		function executeBatchReplace(changeList, modalIndex) {
			var loading = layer.load(2, {shade: false});
			var table = layui.table;
			var tool = layui.tool;
			
			// 构建请求数据 - 后端只需要new_name字段
			var updateData = [];
			changeList.forEach(function(item) {
				updateData.push({
					id: item.id,
					new_name: item.newName  // 这里字段名固定为new_name，后端统一处理
				});
			});
			
			// 发送批量更新请求
			tool.post("/customer/api/batch_update_name", {
				data: JSON.stringify(updateData)
			}, function(res) {
				layer.close(loading);
				
				if (res.code == 0) {
					layer.msg('成功修改了 ' + res.data.success_count + ' 个客户的名称', {icon: 1});
					
					// 关闭替换弹窗
					layer.close(modalIndex);
					
					// 清空选中的客户
					checkboxArr = [];
					$('#exportCheckData').html('0');
					$('#batchRenameData').html('0');
					
					// 刷新表格数据
					layui.pageTable.reload();
				} else {
					layer.msg(res.msg || '修改失败', {icon: 2});
				}
			}, function() {
				layer.close(loading);
				layer.msg('请求失败，请稍后重试', {icon: 2});
			});
		}

	<script type="text/javascript">
		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content = 
					`width=${pcWidth}, initial-scale=${scale}, minimum-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
			});
		})();
		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
