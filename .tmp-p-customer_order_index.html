<script>
    const moduleInit = ['tool', 'tablePlus', 'laydatePlus'];
    
    // 解析订单内容的函数
    function parseOrderContent(content) {
        const result = {
            customerName: '',
            products: [],
            remark: '',
            gift: '',
            receiverInfo: {
                name: '',
                phone: '',
                address: ''
            },
            rawText: content
        };
        
        const lines = content.split('\n').filter(line => line.trim() !== '');
        
        lines.forEach(line => {
            const trimmedLine = line.trim();
            
            // 匹配公司名称（通常在第一行，且不包含"指标"、"收货地址"、"备注"等关键词）
            if (!result.customerName && !trimmedLine.includes('指标') && 
                !trimmedLine.includes('收货地址') && !trimmedLine.includes('备注') &&
                !trimmedLine.includes('小礼品')) {
                result.customerName = trimmedLine;
            }
            
            // 匹配指标/产品
            if (trimmedLine.includes('指标') && trimmedLine.includes('：')) {
                const productMatch = trimmedLine.match(/指标\d*：(.+)/);
                if (productMatch) {
                    const productStr = productMatch[1].trim();
                    // 使用更灵活的正则匹配产品信息
                    const productPattern = /([A-Za-z0-9\-]+)\s+(.+?)\s+(\d+[A-Za-z\u4e00-\u9fa5]+)\s+(\d+(?:\.\d+)?)元/;
                    const match = productStr.match(productPattern);
                    
                    if (match) {
                        const product = {
                            code: match[1], // 产品编号
                            name: match[2], // 产品名称
                            spec: match[3], // 规格
                            price: parseFloat(match[4]), // 价格
                            rawLine: trimmedLine
                        };
                        result.products.push(product);
                    } else {
                        // 尝试其他格式的解析
                        const parts = productStr.split(/\s+/).filter(p => p);
                        if (parts.length >= 4) {
                            const product = {
                                code: parts[0],
                                name: parts.slice(1, parts.length - 2).join(' '),
                                spec: parts[parts.length - 2],
                                price: parseFloat(parts[parts.length - 1].replace('元', '')),
                                rawLine: trimmedLine
                            };
                            result.products.push(product);
                        }
                    }
                }
            }
            
            // 匹配收货地址
            if (trimmedLine.includes('收货地址：')) {
                const addressMatch = trimmedLine.match(/收货地址：(.+)/);
                if (addressMatch) {
                    result.receiverInfo.address = addressMatch[1].trim();
                    
                    // 检查下一行是否有收件人信息
                    const nextLineIndex = lines.indexOf(line) + 1;
                    if (nextLineIndex < lines.length) {
                        const nextLine = lines[nextLineIndex].trim();
                        // 匹配姓名和电话（格式：姓名 电话）
                        const receiverMatch = nextLine.match(/([\u4e00-\u9fa5]{2,4})\s+(\d{11})/);
                        if (receiverMatch) {
                            result.receiverInfo.name = receiverMatch[1];
                            result.receiverInfo.phone = receiverMatch[2];
                        } else {
                            // 尝试在当前行中匹配
                            const inlineMatch = addressMatch[1].match(/([\u4e00-\u9fa5]{2,4})\s+(\d{11})/);
                            if (inlineMatch) {
                                result.receiverInfo.name = inlineMatch[1];
                                result.receiverInfo.phone = inlineMatch[2];
                                result.receiverInfo.address = addressMatch[1].replace(inlineMatch[0], '').trim();
                            }
                        }
                    }
                }
            }
            
            // 匹配备注
            if (trimmedLine.includes('备注：')) {
                const remarkMatch = trimmedLine.match(/备注：(.+)/);
                if (remarkMatch) {
                    result.remark = remarkMatch[1].trim();
                }
            }
            
            // 匹配小礼品
            if (trimmedLine.includes('小礼品：')) {
                const giftMatch = trimmedLine.match(/小礼品：(.+)/);
                if (giftMatch) {
                    result.gift = giftMatch[1].trim();
                }
            }
        });
        return result;
    }
    
    // 格式化解析结果显示
    function formatParseResult(result) {
        let html = '<div class="parse-result-detail">';
        
        html += `<p><strong>客户名称：</strong>${result.customerName || '未识别'}</p>`;
        
        if (result.products.length > 0) {
            html += '<p><strong>产品列表：</strong></p>';
            html += '<table style="width:100%; border-collapse: collapse; margin: 5px 0;">';
            html += '<tr style="background-color: #f2f2f2;">';
            html += '<th style="border:1px solid #ddd; padding:4px;">编号</th>';
            html += '<th style="border:1px solid #ddd; padding:4px;">名称</th>';
            html += '<th style="border:1px solid #ddd; padding:4px;">规格</th>';
            html += '<th style="border:1px solid #ddd; padding:4px;">价格</th>';
            html += '</tr>';
            
            result.products.forEach((product, index) => {
                html += '<tr>';
                html += `<td style="border:1px solid #ddd; padding:4px;">${product.code}</td>`;
                html += `<td style="border:1px solid #ddd; padding:4px;">${product.name}</td>`;
                html += `<td style="border:1px solid #ddd; padding:4px;">${product.spec}</td>`;
                html += `<td style="border:1px solid #ddd; padding:4px;">${product.price}元</td>`;
                html += '</tr>';
            });
            
            html += '</table>';
        } else {
            html += '<p><strong>产品列表：</strong>未识别到产品信息</p>';
        }
        
        if (result.receiverInfo.name || result.receiverInfo.address) {
            html += '<p><strong>收货信息：</strong></p>';
            html += `<p style="margin-left:20px;">收件人：${result.receiverInfo.name || '未识别'}</p>`;
            html += `<p style="margin-left:20px;">电话：${result.receiverInfo.phone || '未识别'}</p>`;
            html += `<p style="margin-left:20px;">地址：${result.receiverInfo.address || '未识别'}</p>`;
        }
        
        if (result.remark) {
            html += `<p><strong>备注：</strong>${result.remark}</p>`;
        }
        
        if (result.gift) {
            html += `<p><strong>小礼品：</strong>${result.gift}</p>`;
        }
        
        html += '</div>';
        return html;
    }

		function openQuickOrderDialog() {
			layer.open({
				type: 1,
				title: '快捷下单 - 粘贴订单内容',
				area: ['850px', '750px'],
				content: $('#quickOrderTemplate').html(),
				btn: ['确认下单', '取消'],
				yes: function(index, layero) {
					const content = $('#quickOrderContent').val().trim();
					if (!content) {
						layer.msg('请先粘贴订单内容');
						return;
					}
					
					// 解析内容
					const parsedResult = parseOrderContent(content);
					
					// 显示加载中
					const loadIndex = layer.load(1, {
						shade: [0.1, '#fff']
					});
					let callback = function (e) {
						layer.close(loadIndex);
						if (e.code == 0) {
							tool.side("/customer/order/add?quick_key=" + e.data.quick_key);
						}
					}
					tool.post("/customer/order/add", {
						content: content,
						parsed_data: JSON.stringify(parsedResult)
					}, callback);
				},
				success: function(layero, index) {
					// 绑定解析按钮事件
					$('#parseContent').on('click', function() {
						const content = $('#quickOrderContent').val().trim();
						if (!content) {
							layer.msg('请先粘贴订单内容');
							return;
						}
						
						const parsedResult = parseOrderContent(content);
						const formattedResult = formatParseResult(parsedResult);
						$('#parseResult').html(formattedResult);
						
						// 高亮显示解析到的信息
						setTimeout(() => {
							$('#parseResult').find('strong').css('color', '#009688');
						}, 100);
					});
					
					// 绑定清空按钮事件
					$('#clearContent').on('click', function() {
						$('#quickOrderContent').val('');
						$('#parseResult').html('解析结果将在此显示...');
					});
				}
			});
		}

                            </div>\

                                <label class="layui-form-label"></label>\
                                <div class="layui-input-block red" id="gougu-upload-note"></div>\
                            </div>\

                                <label class="layui-form-label"></label>\
                                <div class="layui-input-block">\
                                    <button type="button" class="layui-btn" id="uploadAjax">上传并导入</button>\
                                </div>\
                            </div>\
                        </div> \
                </div>',
                success: function (layero, idx) {
                    form.render();
                    //选文件
                    let uploadImport = upload.render({
                        elem: '#uploadSelect'
                        , url: '/api/import/import_order'
                        , auto: false
                        , accept: 'file' //普通文件
                        , acceptMime: 'application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' // 此处设置上传的文件格式
                        , exts: 'xls|xlsx' //只允许上传文件格式
                        , bindAction: '#uploadAjax'
                        , choose: function (obj) {
                            uploadFiles = obj.pushFile();
                            // 清空,防止多次上传
                            clearFile();
                            obj.preview(function (index, file, result) {
                                obj.pushFile();// 再添加
                                $('#gougu-upload-choosed').html('已选择：' + file.name);
                            });
                        }
                        , before: function (obj) {
                        }
                        , progress: function (n, elem, e) {
                            $('#gougu-upload-note').html('文件上传中...');
                            if (n == 100) {
                                $('#gougu-upload-note').html('数据导入中...');
                            }
                        }
                        , error: function (index, upload) {
                            clearFile();
                            $('#gougu-upload-note').html('数据导入失败，请关闭重试');
                        }
                        , done: function (res, index, upload) {
                            clearFile();
                            layer.msg(res.msg);
                            $('#gougu-upload-note').html(res.msg);
                            if (res.code == 0) {
                                layer.close(idx);
                                layui.pageTable.reload();
                            }
                        }
                    });
                }
            });
        }
        
        //监听行工具事件
        table.on('tool(test)', function (obj) {
            var data = obj.data;
            if (obj.event === 'view') {
                tool.side("/customer/order/view?id=" + data.id);
                return;
            }
            if (obj.event === 'edit') {
                tool.side("/customer/order/add?id=" + data.id);
                return;
            }
            if (obj.event === 'del') {
                layer.confirm('确定删除该订单记录吗？', {
                    icon: 3,
                    title: '提示'
                }, function (index) {
                    $.ajax({
                        url: "/customer/order/delete",
                        type: 'post',
                        data: { id: data.id },
                        success: function (res) {
                            layer.msg(res.msg);
                            if (res.code == 0) {
                                obj.del();
                            }
                        }
                    })
                    layer.close(index);
                });
            }
            if (obj.event === 'pay_record') {
                // layer.msg('功能开发中')
                // return false;
                tool.side("/customer/order/payrecord?id=" + data.id);
                return;
            }
            if (obj.event === 'sales_agreement') {
                // layer.msg('功能开发中')
                // return false;
                window.open('/customer/order/salesagreement.html?id=' + data.id)
                return;
            }
            if (obj.event === 'repurchase') {
                tool.side("/customer/order/add?old_id=" + data.id);
                return;
            }
        });
    }
</script>

	<script type="text/javascript">
		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content = 
					`width=${pcWidth}, initial-scale=${scale}, minimum-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
			});
		})();
		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
