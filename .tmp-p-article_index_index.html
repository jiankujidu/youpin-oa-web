<script>
	const moduleInit = ['tool','tablePlus'];
	function gouguInit() {
		var table = layui.tablePlus, tool = layui.tool ,form = layui.form;
		layui.pageTable = table.render({
			elem: '#test',
			toolbar: '#barDemo',
			title: '问答列表',
			lineStyle: 'height: 200px;', // 定义表格的多行样式
			url: "/article/index/index", //数据接口
			height: 'full-35', // 最大高度减去其他容器已占有的高度差
			cols: [
				[ //表头
					{
						field: 'id',
						title: '编号',
						align: 'center',
						width: 80
					}, {
						field: 'sort',
						title: '排序',
						align: 'center',
						width: 66
					}, {
						field: 'cate_title',
						title: '分类',
						align: 'center',
						width: 120
					}, {
						field: 'title',
						title: '问题',
						templet: function(d){
							// 替换换行符 \n 为 <br> 标签
 							 let formattedTitle = d.title.replace(/\n/g, '<br>');
							return '<div><a data-href="/article/index/view/id/'+d.id+'.html" class="side-a">'+formattedTitle+'</a></div>';
						}
					}, {
						field: 'title',
						title: '回答',
						templet: function(d){
							return '<div>'+ d.content +'</div>';
						}
					}, {
						field: 'read',
						title: '阅读量',
						align: 'center',
						width: 80
					}, {
						field: 'user',
						title: '发布人',
						align: 'center',
						width: 80
					}, {
						field: 'department',
						title: '部门',
						align: 'center',
						width: 100
					}, {
						field: 'right',
						title: '操作',
						toolbar: '#operateBarDemo',
						width: 100,
						align: 'center'
					}
				]
			]
		});
		table.on('tool(test)', function(obj) {
			var data = obj.data;
			if(obj.event === 'edit'){
				tool.side('/article/index/listadd?id='+data.id);
				return;
			}
			if (obj.event === 'del') {
				layer.confirm('确定要删除吗?', {
					icon: 3,
					title: '提示'
				}, function(index) {
					let callback = function (res) {
						layer.msg(res.msg);
						if (res.code == 0) {
							obj.del();
						}
					}
					tool.delete("/article/index/listdelete", {id: data.id}, callback);
					layer.close(index);
				});
			}
		});
		//表头工具栏事件
		table.on('toolbar(test)', function(obj){
			if (obj.event === 'export') {
				layer.confirm('确定要导出当前条件下的售前售后查询数据吗?', {
					icon: 3,
					title: '提示'
				}, function(index) {
					const params = new URLSearchParams();
					const queryString = params.toString();
					window.open('/article/index/index?export=1&limit=10000000000&'+queryString, '_blank');
					layer.close(index);
				});
				return;
			}
		});
	}
</script>

	<!-- /脚本 -->
	<script src="/static/assets/layui/layui.js"></script>
	<script src="/static/assets/gougu/gouguInit.js"></script>
	<script type="text/javascript">
		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content = 
					`width=${pcWidth}, initial-scale=${scale}, minimum-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
			});
		})();
		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
