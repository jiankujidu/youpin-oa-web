<!-- 模板选择弹窗 -->
<div id="templateSelectDialog" style="display: none;">
    <div class="layui-form p-3">
        <div class="layui-form-item">
            <label class="layui-form-label">说明书模板：</label>
            <div class="layui-input-block" style="width: 37%;">
                <select name="template_id" id="templateSelectSingle" lay-search lay-verify="required">
                    <option value="">请选择或搜索说明书模板</option>
                </select>
                <div class="layui-form-mid layui-word-aux">输入关键词可快速查找模板</div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" id="btnAnalyzeTemplate">分析模板</button>
                <button type="button" class="layui-btn layui-btn-primary" id="btnCancelGenerate">取消</button>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"></label>
            <div class="layui-input-block" id="analyzeResult"></div>
        </div>
    </div>
</div>

<!-- 占位符数据确认弹窗 -->
<div id="placeholderConfirmDialog" style="display: none;">
    <div class="layui-fluid" style="padding: 15px;">
        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <span>数据确认与编辑 - <span id="productTitle"></span> (<span id="productGoodsNo"></span>)</span>
                        <div class="layui-btn-group" style="float: right;">
                            <button class="layui-btn layui-btn-sm layui-btn-normal" onclick="savePlaceholders()">
                                确认并生成WORD
                            </button>
                            <button class="layui-btn layui-btn-sm layui-btn-primary" onclick="closePlaceholderDialog()">
                               返回
                            </button>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-row mb-3">
                            <div class="layui-col-md12">
                                <div class="layui-card">
                                    <div class="layui-card-header">
                                        <i class="layui-icon layui-icon-template-1"></i> 模板信息
                                        <span class="layui-badge layui-bg-blue ml-2" id="placeholderCount">0</span>
                                        <span class="layui-badge ml-2" id="autoFillCount">0</span>
                                        <span class="layui-badge layui-bg-orange ml-2" id="manualFillCount">0</span>
                                    </div>
                                    <div class="layui-card-body">
                                        <p><strong>模板ID：</strong><span id="templateIdInfo"></span></p>
                                        <p><strong>模板占位符：</strong><span id="placeholderList"></span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 自动匹配的数据 -->
                        <div class="layui-row mb-3">
                            <div class="layui-col-md12">
                                <div class="layui-card">
                                    <div class="layui-card-header">
                                        <i class="layui-icon layui-icon-ok-circle" style="color: #5FB878;"></i> 已自动匹配数据
                                    </div>
                                    <div class="layui-card-body">
                                        <div class="layui-row" id="autoMatchedData">
                                            <!-- 自动匹配的数据项将通过JS填充 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 需要确认/编辑的数据 -->
                        <div class="layui-row">
                            <div class="layui-col-md12">
                                <div class="layui-card">
                                    <div class="layui-card-header">
                                        <i class="layui-icon layui-icon-edit" style="color: #FFB800;"></i> 请确认并编辑以下数据
                                        <span class="layui-badge layui-bg-red ml-2" id="requiredCount">0</span>
                                    </div>
                                    <div class="layui-card-body">
                                        <form class="layui-form" id="placeholderForm">
                                            <!-- 所有占位符表单项目将通过JS填充 -->
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 操作按钮 -->
                        <div class="layui-row mt-3">
                            <div class="layui-col-md12">
                                <div class="layui-form-item">
                                    <div class="layui-input-block">
                                        <button type="button" class="layui-btn layui-btn-normal layui-btn-lg" onclick="savePlaceholders()">
                                            <i class="layui-icon layui-icon-ok"></i> 确认数据并生成WORD
                                        </button>
                                        <button type="button" class="layui-btn layui-btn-primary layui-btn-lg" onclick="defaultAllPlaceholders()">
                                            <i class="layui-icon layui-icon-refresh"></i> 重置为默认值
                                        </button>
                                        <button type="button" class="layui-btn layui-btn-danger layui-btn-lg" onclick="closePlaceholderDialog()">
                                            <i class="layui-icon layui-icon-close"></i> 取消
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

			//console.log(obj)
			//全选
			if(obj.type=="all"){
				var id = obj.config.id;
				if(obj.checked){
					//选中
    				var checkStatus = table.checkStatus(id);
					var checkData = checkStatus.data.map(item => item.id);
					// 使用 Set 来存储目标数组中的值
					const set = new Set(checkboxArr);
					// 过滤掉已存在于目标数组的值，然后将剩余值添加到目标数组中
					const uniqueValues = checkData.filter(item => !set.has(item));
					checkboxArr = checkboxArr.concat(uniqueValues);
				}else{
					//取消选中
					var getData = table.getData(id).map(item => item.id);
					// 使用 filter 方法来剔除另一个数组中包含的值
					checkboxArr = checkboxArr.filter(item => !getData.includes(item));
				}
				
			}else if(obj.type=="one"){
				//单选
				if(obj.checked){
					//选中
					checkboxArr.push(obj.data.id)
				}else{
					//取消选中
					checkboxArr = checkboxArr.filter(item => item !== obj.data.id);
				}
			}
			checkboxArr = Array.from(new Set(checkboxArr));
			$('#exportCheckData').html(checkboxArr.length)
		});

	// 分析模板占位符
	function analyzeTemplate() {
		let templateId = $('#templateSelectSingle').val();
		
		if (!templateId) {
			$('#analyzeResult').html('<span class="red">请选择说明书模板！</span>');
			return;
		}
		
		// 存储模板ID
		currentProcess.template_id = templateId;
		
		// 显示加载中
		let loadingIndex = layer.load(2, {time: 30000});
		$('#analyzeResult').html('');
		
		// 发送请求分析模板
		$.ajax({
			url: '/api/index/preview_template_placeholders',
			type: 'POST',
			data: {
				product_id: currentProcess.product_id,
				goods_no: currentProcess.goods_no,
				template_id: templateId,
				uid: "84",
				did: "56"
			},
			dataType: 'json',
			success: function(res) {
				layer.close(loadingIndex);
				
				if (res.code == 0) {
					// 存储返回的数据
					currentProcess.placeholder_data = res.data.placeholder_data;
					currentProcess.product_info = res.data.product_info;
					currentProcess.placeholder_explanations = res.data.placeholder_explanations || {};
					
					// 关闭模板选择弹窗
					layer.closeAll('page');
					
					// 显示数据确认弹窗
					showPlaceholderConfirmDialog();
					
				} else {
					$('#analyzeResult').html('<span class="red">分析失败：' + res.msg + '</span>');
				}
			},
			error: function(xhr, status, error) {
				layer.close(loadingIndex);
				$('#analyzeResult').html('<span class="red">请求失败，请稍后重试！</span>');
			}
		});
	}

	// 显示数据确认弹窗
	function showPlaceholderConfirmDialog() {
		// 设置产品信息
		$('#productTitle').text(currentProcess.product_info.title || '');
		$('#productGoodsNo').text(currentProcess.product_info.goods_no || '');
		$('#templateIdInfo').text(currentProcess.template_id);
		
		// 统计信息
		let totalCount = currentProcess.placeholder_data.length;
		let autoCount = 0;
		let manualCount = 0;
		let requiredCount = 0;
		
		let placeholderNames = [];
		
		// 分析数据
		currentProcess.placeholder_data.forEach(item => {
			placeholderNames.push(item.placeholder);
			if (item.source === 'auto' && item.value) {
				autoCount++;
			} else {
				manualCount++;
			}
			if (item.required) {
				requiredCount++;
			}
		});
		
		// 更新统计
		$('#placeholderCount').text(totalCount);
		$('#autoFillCount').text(autoCount);
		$('#manualFillCount').text(manualCount);
		$('#requiredCount').text(requiredCount);
		$('#placeholderList').text(placeholderNames.join(', '));
		
		// 生成自动匹配数据区域
		generateAutoMatchedData();
		
		// 生成表单区域
		generatePlaceholderForm();
		
		// 显示弹窗
		layer.open({
			type: 1,
			title: '数据确认 - ' + currentProcess.goods_no,
			area: ['95%', '95%'],
			content: $('#placeholderConfirmDialog'),
			success: function() {
				layui.form.render();
				// 初始化富文本编辑器（如果有的话）
				initTextareaEditors();
			}
		});
	}

	// 生成自动匹配数据区域
	function generateAutoMatchedData() {
		let html = '';
		let hasAutoMatched = false;
		
		currentProcess.placeholder_data.forEach((item, index) => {
			if (item.source === 'auto' && item.value) {
				hasAutoMatched = true;
				let explanation = currentProcess.placeholder_explanations[item.placeholder] || item.explanation;
				
				html += '<div class="layui-col-md4">';
				html += '<div class="layui-card layui-card-sm" style="margin-bottom: 10px;">';
				html += '<div class="layui-card-header" style="padding: 8px 15px; background-color: #f8f8f8;">';
				html += '<strong>${' + item.placeholder + '}</strong>';
				html += '<span class="layui-badge layui-bg-green layui-badge-sm" style="float: right;">自动</span>';
				html += '</div>';
				html += '<div class="layui-card-body" style="padding: 10px 15px; min-height: 60px;">';
				html += '<div><small class="layui-word-aux">' + explanation + '</small></div>';
				html += '<div>' + (item.value || '<span class="red">(空)</span>') + '</div>';
				html += '</div>';
				html += '</div>';
				html += '</div>';
			}
		});
		
		if (!hasAutoMatched) {
			html = '<div class="layui-col-md12"><div class="layui-empty">没有找到自动匹配的数据</div></div>';
		}
		
		$('#autoMatchedData').html(html);
	}

	// 生成占位符表单
	function generatePlaceholderForm() {
		let formHtml = '<div class="layui-row">';
		
		currentProcess.placeholder_data.forEach((item, index) => {
			// 自动匹配且有值的字段不需要在表单中显示
			if (item.source === 'auto' && item.value) {
				return;
			}
			
			let placeholder = item.placeholder;
			let value = item.value || '';
			let explanation = currentProcess.placeholder_explanations[placeholder] || item.explanation;
			let type = item.type || 'text';
			let required = item.required ? 'lay-verify="required"' : '';
			let requiredStar = item.required ? '<span style="color: red;">*</span>' : '';
			
			formHtml += '<div class="layui-col-md6">';
			formHtml += '<div class="layui-form-item">';
			formHtml += '<label class="layui-form-label">';
			formHtml += requiredStar + '${' + placeholder + '}';
			formHtml += '<div class="layui-form-mid layui-word-aux">' + explanation + '</div>';
			formHtml += '</label>';
			formHtml += '<div class="layui-input-block">';
			
			if (type === 'textarea') {
				formHtml += '<textarea name="' + placeholder + '" placeholder="请输入' + explanation + '" ';
				formHtml += 'class="layui-textarea placeholder-textarea" ';
				formHtml += 'data-index="' + index + '" ';
				formHtml += required + ' rows="3">' + value + '</textarea>';
			} else if (type === 'select') {
				formHtml += '<select name="' + placeholder + '" class="layui-select" ';
				formHtml += 'data-index="' + index + '" ' + required + '>';
				formHtml += '<option value="">请选择</option>';
				
				// 根据占位符提供不同的选项
				let options = getSelectOptionsByPlaceholder(placeholder);
				options.forEach(opt => {
					let selected = opt.value == value ? 'selected' : '';
					formHtml += '<option value="' + opt.value + '" ' + selected + '>' + opt.label + '</option>';
				});
				
				formHtml += '</select>';
			} else {
				formHtml += '<input type="text" name="' + placeholder + '" ';
				formHtml += 'value="' + value + '" ';
				formHtml += 'placeholder="请输入' + explanation + '" ';
				formHtml += 'class="layui-input placeholder-input" ';
				formHtml += 'data-index="' + index + '" ';
				formHtml += required + '>';
			}
			
			formHtml += '</div>';
			formHtml += '</div>';
			formHtml += '</div>';
		});
		
		formHtml += '</div>';
		
		$('#placeholderForm').html(formHtml);
	}

	// 根据占位符获取选择框选项
	function getSelectOptionsByPlaceholder(placeholder) {
		// 定义常见选项
		const placeholderOptions = {
			'E': [ // 种属
				{value: '人类', label: '人类'},
				{value: '小鼠', label: '小鼠'},
				{value: '大鼠', label: '大鼠'},
				{value: '斑马鱼', label: '斑马鱼'},
				{value: '其他', label: '其他'}
			],
			'F': [ // 应用
				{value: '科研', label: '科研'},
				{value: '诊断', label: '诊断'},
				{value: '治疗', label: '治疗'},
				{value: '检测', label: '检测'}
			],
			'G': [ // 来源
				{value: '进口', label: '进口'},
				{value: '国产', label: '国产'},
				{value: '自研', label: '自研'}
			],
			'T': [ // 定量/定性
				{value: '定量', label: '定量'},
				{value: '定性', label: '定性'},
				{value: '定量/定性', label: '定量/定性'}
			],
			'AA': [ // 产品分类
				{value: '试剂', label: '试剂'},
				{value: '抗体', label: '抗体'},
				{value: '细胞', label: '细胞'},
				{value: '仪器', label: '仪器'},
				{value: '耗材', label: '耗材'}
			]
		};
		
		// 检查标准化占位符
		let placeholderUpper = placeholder.toUpperCase();
		if (placeholderOptions[placeholderUpper]) {
			return placeholderOptions[placeholderUpper];
		}
		
		// 检查是否有解释
		let explanation = currentProcess.placeholder_explanations[placeholderUpper];
		if (explanation && explanation.includes('分类')) {
			return placeholderOptions['AA'] || [];
		}
		
		// 默认选项
		return [
			{value: '是', label: '是'},
			{value: '否', label: '否'},
			{value: '待定', label: '待定'}
		];
	}

	// 重置为默认值
	function defaultAllPlaceholders() {
		layer.confirm('确定要重置所有数据为默认值吗？已填写的数据将被清除。', {
			icon: 3,
			title: '确认重置'
		}, function(index) {
			// 重置所有表单字段
			$('input[type="text"], textarea', '#placeholderForm').each(function() {
				let $field = $(this);
				let fieldName = $field.attr('name');
				let isRequired = $field.attr('lay-verify') === 'required';
				
				if (isRequired) {
					// 必填字段设置默认值
					if (fieldName === 'A') {
						$field.val(currentProcess.goods_no);
					} else if (fieldName === 'B') {
						$field.val(currentProcess.product_info.title || '');
					} else if (fieldName === 'C') {
						$field.val(currentProcess.product_info.gene_name || '');
					} else {
						$field.val('');
					}
				} else {
					$field.val('');
				}
			});
			
			// 重置下拉框
			$('select', '#placeholderForm').each(function() {
				let $select = $(this);
				let isRequired = $select.attr('lay-verify') === 'required';
				
				if (isRequired) {
					$select.val($select.find('option:first').val());
				} else {
					$select.val('');
				}
			});
			
			layui.form.render();
			layer.close(index);
			layer.msg('已重置为默认值');
		});
	}

	// 收集表单数据并更新到当前流程
	function collectFormData() {
		let isValid = true;
		let fieldErrors = [];
		
		// 验证必填字段
		$('[lay-verify="required"]', '#placeholderForm').each(function() {
			let $field = $(this);
			let value = $field.val();
			let placeholder = $field.attr('name');
			let explanation = currentProcess.placeholder_explanations[placeholder] || placeholder;
			
			if (!value || value.trim() === '') {
				isValid = false;
				fieldErrors.push('${' + placeholder + '} - ' + explanation);
				$field.addClass('layui-form-danger');
			} else {
				$field.removeClass('layui-form-danger');
			}
		});
		
		if (!isValid) {
			layer.msg('请填写以下必填字段：<br>' + fieldErrors.join('<br>'), {
				time: 5000,
				icon: 2
			});
			return false;
		}
		
		// 收集所有字段数据
		let formData = {};
		$('input, textarea, select', '#placeholderForm').each(function() {
			let $field = $(this);
			let fieldName = $field.attr('name');
			let value = $field.val();
			
			formData[fieldName] = value;
		});
		
		// 更新当前流程中的占位符数据
		currentProcess.placeholder_data.forEach((item, index) => {
			let placeholder = item.placeholder;
			if (formData.hasOwnProperty(placeholder)) {
				currentProcess.placeholder_data[index].value = formData[placeholder];
				currentProcess.placeholder_data[index].source = 'manual';
			}
		});
		
		// 验证是否有空值
		let emptyFields = [];
		currentProcess.placeholder_data.forEach(item => {
			if (!item.value || item.value.trim() === '') {
				emptyFields.push('${' + item.placeholder + '}');
			}
		});
		
		if (emptyFields.length > 0) {
			layer.confirm('以下占位符仍为空：<br>' + emptyFields.join(', ') + '<br>是否继续生成？', {
				icon: 3,
				title: '确认空值',
				btn: ['继续生成', '返回修改']
			}, function(index) {
				savePlaceholders(true)
				return true;
			}, function(index) {
				layer.close(index);
				return false;
			});
		}else{ 
			return true;
		}
		
	}

	// 保存占位符数据并生成Word
	function savePlaceholders(flag) {
		// 收集并验证表单数据
		if (!flag && !collectFormData()) {
			return false;
		}
		// 确认提交
		layer.confirm('确认数据无误并生成Word说明书吗？', {
			icon: 3,
			title: '确认生成'
		}, function(index) {
			layer.close(index);
			
			// 显示生成中
			let loadingIndex = layer.load(2, {time: 60000});
			
			// 提交数据生成Word
			$.ajax({
				url: '/api/index/confirm_and_generate_word',
				type: 'POST',
				data: {
					product_id: currentProcess.product_id,
					goods_no: currentProcess.goods_no,
					template_id: currentProcess.template_id,
					placeholder_data: currentProcess.placeholder_data,
					uid: "84",
					did: "56"
				},
				dataType: 'json',
				success: function(res) {
					layer.close(loadingIndex);
					
					if (res.code == 0) {
						// 关闭数据确认弹窗
						layer.closeAll('page');
						
						// 显示生成结果
						showGenerateResult(res.data);
						
					} else {
						layer.msg('生成失败：' + res.msg, {icon: 2});
					}
				},
				error: function(xhr, status, error) {
					layer.close(loadingIndex);
					layer.msg('请求失败，请稍后重试！', {icon: 2});
				}
			});
		});
	}

	// 显示生成结果
	function showGenerateResult(resultData) {
		let html = '';
		
		if (resultData) {
			html += '<div class="text-center">';
			html += '<i class="layui-icon layui-icon-ok-circle" style="font-size: 64px; color: #5FB878;"></i>';
			html += '<h2 class="mt-3 green">说明书Word生成成功！</h2>';
			html += '<div class="mt-4">';
			//html += '<a href="' + resultData.preview_url + '" target="_blank" class="layui-btn layui-btn-normal layui-btn-lg mr-3">';
			//html += '<i class="layui-icon">&#xe615;</i> 在线预览';
			//html += '</a>';
			html += '<a href="' + resultData.download_url + '" download="' + (resultData.file_name || '说明书.docx') + '" class="layui-btn layui-btn-warm layui-btn-lg">';
			html += '<i class="layui-icon">&#xe601;</i> 下载Word';
			html += '</a>';
			html += '</div>';
			html += '</div>';
		} else {
			html = '<div class="text-center"><span class="red">生成结果异常</span></div>';
		}
		
		$('#generateResultContent').html(html);
		
		layer.open({
			type: 1,
			title: '生成完成',
			area: ['500px', '350px'],
			content: $('#generateResultDialog'),
			btn: ['确定'],
			yes: function(index) {
				layer.close(index);
				refreshProductList();
			}
		});
	}

	// 刷新产品列表
	function refreshProductList() {
		if (layui.pageTable) {
			layui.pageTable.reload();
			layer.msg('产品列表已刷新');
		}
	}

	// 关闭数据确认弹窗
	function closePlaceholderDialog() {
		layer.closeAll('page');
	}

	function createdWord(product_id, goods_no) { 
		// 显示模板选择弹窗
		showTemplateSelectDialog(product_id, goods_no);
	}
</script>

				document.querySelector('meta[name="viewport"]').content =

		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
