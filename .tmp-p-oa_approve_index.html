	<script>
	const moduleInit = ['tool'];
	function gouguInit() {
		var form = layui.form,table = layui.table, tool = layui.tool ,element=layui.element;
			
		element.on('tab(tab)', function(data){
			let product_name = $('input[name="product_name"]').val();
			layui.pageTable.reload({where:{status:data.index,product_name:product_name},page:{curr:1}});
			$('[name="status"]').val(data.index);
			return false;
		});			
		//监听搜索提交
		form.on('submit(webform)', function(data) {
			layui.pageTable.reload({
				where: data.field,
				page: {curr: 1}
			});
			return false;
		});
		layui.pageTable = table.render({
			elem: '#test'
			,toolbar: '#toolbarDemo'
			,defaultToolbar: false
			,title:'审批列表'
			,url: "/oa/approve/index"
			,page: true //开启分页
			,limit: 20
			,cellMinWidth: 80
			,cols: [[
					{field:'id',width:80, title: 'ID号', align:'center'}
					,{field:'admin_name',title: '申请人',width:90,align:'center'}
					,{field:'create_time',title: '申请时间',width:132,align:'center'}
					,{field:'flow_type',title: '审批类型',width:100, align:'center'}
					,{field:'department_name',title: '所属部门',width:100,align:'center'}
					,{field:'product_msg',title: '物品名称',width:100,align:'center'}
					,{field:'check_user',title: '当前审批人'}
					,{field:'check_status', title: '审批状态',width:80,align:'center',templet: function(d){
						var htmlArray = ['<span style="color:#666666">待审批</span>','<span style="color:#4285f4">审批中</span>','<span style="color:#34a853">已通过</span>','<span style="color:#FF5722">已拒绝</span>','<span style="color:#fbbc05">已撤销</span>'];
						return htmlArray[d.check_status];
					}}
					,{width:180,title: '操作', align:'center',templet: function(d){
						var html='<a class="layui-btn layui-btn-xs" lay-event="view">详情</a>';
						if(d.type==13){
							html+='<a class="layui-btn layui-btn-warm layui-btn-xs"  data-type="'+d.type+'" data-id="'+d.id+'" lay-event="reapply">重申</a>';
						}
						var btn0='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
						if(d.check_status==4){
							return html+btn0;
						}
						return html;
					}}
				]]
			});
			
			table.on('tool(test)',function (obj) {
				if(obj.event === 'view'){		
					tool.side('/oa/approve/view?id='+obj.data.id);
				}
				if (obj.event === 'reapply') {
					var type=$(this).data('type');
					var id=$(this).data('id');
					tool.side('/oa/approve/add?type='+type+'&reapplyid='+id);	
				}
				if (obj.event === 'del') {
					layer.confirm('确定要删除吗?', {
						icon: 3,
						title: '提示'
					}, function(index) {
						let callback = function (e) {
							layer.msg(e.msg);
							if (e.code == 0) {
								obj.del();
							}
						}
						tool.delete("/oa/approve/delete", {id: obj.data.id}, callback);
						layer.close(index);
					});
				}
			});
			
			$('.square').on('click','.layui-col-md4',function(){
				var type=$(this).data('type');
				tool.side('/oa/approve/add?type='+type);	
			});

		}
	</script>

	<!-- /脚本 -->

	<script type="text/javascript">
		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content = 
					`width=${pcWidth}, initial-scale=${scale}, minimum-scale=${scale}, maximum-scale=${scale}, user-scalable=no`;
			});
		})();
		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
