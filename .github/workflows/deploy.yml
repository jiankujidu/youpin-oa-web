name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 只授予 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：排队而非互相取消，避免部署中途被中断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # ===== 站点 base（子路径部署必填）=====
          # 项目页 https://<用户名>.github.io/<仓库名>/  → VITE_BASE=/<仓库名>/
          # 自定义域名（CNAME，用户/组织页）              → VITE_BASE=/
          VITE_BASE: ${{ vars.VITE_BASE || '/youpin-oa-web/' }}
          # ===== 可选：真实 OA 后端的 CORS 代理（留空则用内置演示数据）=====
          VITE_OA_PROXY: ${{ vars.VITE_OA_PROXY }}
          # ===== 可选：上传服务凭证（留空则上传按钮明确提示「未配置」）=====
          VITE_CLOUDINARY_CLOUD: ${{ vars.VITE_CLOUDINARY_CLOUD }}
          VITE_CLOUDINARY_PRESET: ${{ vars.VITE_CLOUDINARY_PRESET }}
          VITE_CLOUDINARY_FOLDER: ${{ vars.VITE_CLOUDINARY_FOLDER }}
          VITE_UPLOADCARE_PUB_KEY: ${{ vars.VITE_UPLOADCARE_PUB_KEY }}
          VITE_R2_PRESIGN_URL: ${{ vars.VITE_R2_PRESIGN_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库尚未启用 Pages，自动启用并设为 GitHub Actions 构建源，避免首次部署失败
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
