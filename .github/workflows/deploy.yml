name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 只授予 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：排队而非互相取消，避免部署中途被中断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # ===== 站点 base =====
          # 自定义域名模式（已绑定 web.jk93.qzz.io，根路径服务）→ VITE_BASE=/
          # 若改回项目子路径页 https://<用户名>.github.io/<仓库名>/ → 设仓库变量 VITE_BASE=/<仓库名>/
          # './' = 相对路径资源：既能跑在 https://<用户名>.github.io/<仓库名>/ 子路径下，
          # 也能跑在自定义域名根路径下（两种入口共用同一个构建产物）
          VITE_BASE: ${{ vars.VITE_BASE || './' }}
          # ===== OA 后端 CORS 代理（默认已部署的 youpin-oa-proxy Worker）=====
          # 置仓库变量 VITE_OA_PROXY 可覆盖；设为空字符串则回落演示数据模式
          # 默认走 Cloudflare Pages 的同源代理（workers.dev 在部分网络不可达）
          VITE_OA_PROXY: ${{ vars.VITE_OA_PROXY || 'https://youpin-oa.pages.dev/oa-proxy' }}
          # ===== 可选：上传服务凭证（留空则上传按钮明确提示「未配置」）=====
          VITE_CLOUDINARY_CLOUD: ${{ vars.VITE_CLOUDINARY_CLOUD }}
          VITE_CLOUDINARY_PRESET: ${{ vars.VITE_CLOUDINARY_PRESET }}
          VITE_CLOUDINARY_FOLDER: ${{ vars.VITE_CLOUDINARY_FOLDER }}
          VITE_UPLOADCARE_PUB_KEY: ${{ vars.VITE_UPLOADCARE_PUB_KEY }}
          VITE_R2_PRESIGN_URL: ${{ vars.VITE_R2_PRESIGN_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 启用 GitHub Pages，默认以 jiankujidu.github.io/youpin-oa-web/ 提供服务；
          # web.jk93.qzz.io 由本机 nginx 单独承载，不在此占用自定义域名
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
