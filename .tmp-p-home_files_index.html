<style>
    body { display: flex; overflow: hidden; height: 100vh; }
    ::-webkit-scrollbar { display: none; width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { border-radius: 10px; background-color: #e1e1e1; }

	.container { display: flex; flex: 1; flex-direction: column; overflow: hidden; padding:12px;}
    .file-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; border-radius: 2px; background: #ffffff; box-shadow: rgba(0, 0, 0, 0.05) 0 1px 2px 0; }

    /** 分组 **/

    .file-item .group ul li > span { display: flex; flex: 1; overflow: hidden; margin-right: 0.5rem; text-overflow: ellipsis; white-space: nowrap; }

    .file-item .group .footer { display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; border-top: 1px solid #f2f2f2; border-right: 1px solid #f2f2f2; }

    /** 菜单 **/
    .file-item .attach #move:hover { position: relative; opacity: 1; }
    .file-item .attach #move:hover .dropdown { display: block; background-color: #ffffff; }
    .file-item .attach .dropdown { position: absolute; top: 38px; z-index: 100000; display: none; padding: 5px 0; width: 150px; border: 1px solid #dddddd; text-align: left; background-color: #ffffff; line-height: 1.6; }
    .file-item .attach .dropdown em { font-size: 13px; font-weight: 400; color: #333333; font-style: normal; }
    .file-item .attach .dropdown em { display: block; clear: both; padding: 6px 20px; white-space: nowrap; }
    .file-item .attach .dropdown em:hover { background: #eeeeee; }
    .file-item .attach .dropdown em:first-child { font-size: 12px; color: #999999; }
    .file-item .attach .dropdown::before { position: absolute; top: -16px; left: 21px; z-index: 12; display: block; padding: 0; width: 0; height: 0; border-top: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 8px solid #ffffff; border-left: 8px solid transparent; content: ""; box-sizing: content-box; }
    .file-item .attach .dropdown::after { position: absolute; top: -18px; left: 20px; z-index: 10; display: block; padding: 0; width: 0; height: 0; border-top: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 9px solid #cccccc; border-left: 9px solid transparent; content: ""; box-sizing: content-box; }

    /** 文件 **/
    .file-item .attach { position: relative; display: flex; flex: 1; flex-direction: column; }
    .file-item .attach .header { display: flex; align-items: center; justify-content: space-between; padding:12px 15px; margin:0;}

    .file-item .attach .subject { 
		flex: 1; overflow: hidden; overflow-y: auto; margin: 10px; box-sizing: border-box;

	}

	.file-item .attach .subject ul li:hover .file-check{display: block;}

    .file-item .attach .footer { display: flex; align-items: center; justify-content: end; padding: 5px 15px 0; height: 45px; border-top: 1px solid #f2f2f2; text-align: center; background: #ffffff; }

	.file-item .attach .middle { padding: 5px 15px 0; height: 45px; border-top: 1px solid #f2f2f2; background: #ffffff;color:red }

	.gougu-upload-files{background-color: #ffffff; border:1px solid #e4e7ed;color: #c0c4cc;cursor: not-allowed; padding:0 12px; width:180px; box-sizing: border-box; display: inline-block; font-size: inherit; height: 38px; line-height: 35px; margin-right:8px; border-radius:2px;}
	.gougu-upload-tips{color:#969696}
	.layui-form-item{margin-bottom:8px;}
	.layui-input-block{min-height:24px;}
	.layui-tree-main span:hover {  /* 悬停在树节点上时的样式 */
		text-decoration: none !important;  /* 去掉文本下划线 */
	}
	.layui-tree-selected {
		/* background-color: #f3f3f3; */
		color: #63b6f3;
	}
	.layui-dropdown-menu {
		max-height: 500px; /* 设置一个合适的最大高度 */
		overflow-y: auto;  /* 启用垂直滚动 */
	}
</style>

	<div class="layuimini-container">
		<div class="layuimini-main">
			<fieldset class="table-search-fieldset">

	<!-- 脚本 -->
	
<script>
	const moduleInit = ['tool'];
	function gouguInit() {
		var table = layui.table, tool = layui.tool ,tree = layui.tree,form = layui.form,laypage = layui.laypage,upload = layui.upload, element=layui.element, dropdown=layui.dropdown;
		let fileGroup = [{id:0,title:'未分组'}];
		element.on('tab(tab)', function(data){
			$('[name="tab"]').val(data.index);
			$('[lay-filter="webform"]').click();
			return false;
		});	
		
		//监听多选框点击事件  通过 lay-filter="menu"来监听
		form.on('checkbox(all)', function (data) {
			let val = data.value;
			if(data.elem.checked){
				//判断当前多选框是选中还是取消选中
				$('#filesBox li').addClass('on');
			}
			else{
				$('#filesBox li').removeClass('on');
			}
		});
		
		var uploadInst = upload.render({
			elem: '#fileUpload'
			,url: "/api/index/upload"
			, accept: 'file' //普通文件
			,data: {
				group_id: function(){
					return $('[name="group_id"]').val();
				}
			}
			, exts: 'jpeg|jpg|png|gif|doc|docx|ppt|pptx|xls|xlsx|pdf|zip|rar|7z|txt|mp4|psd|svg' //只允许上传文件
			, before: function (obj) {
				layer.msg('上传中...', { time: 3600000 });
			}
			,done: function (res) {
				layer.msg(res.msg);
				$('[lay-filter="webform"]').click();
			}, error: function (index, upload) {
				layer.msg('上传失败');
			}
		});
		$('body').on('click','#fileUploads',function(){
			layer.open({
				type: 1
				,title: '批量上传文件'
				,area: ['auto', 'auto']
				,content: $('#batchFilesDemo').html(),
				success: function(layero, index) {
					// layer.full(index); // 最大化
					var isUploading = false;
					//清空文件列表
					$('#clearList').click(function(){
						if(isUploading){
							layer.msg('正在上传中，请稍后...', {icon: 16,shade: 0.01,time: 1000});
							return;
						}
						// 倒序遍历所有行，避免正序删除导致的元素索引错乱
						$('#demoList tr').get().reverse().forEach(function(row) {
							$(row).find('.demo-delete').trigger('click'); // 触发该行的删除按钮点击事件
						});
						
						// 清空 input file 的值（确保即便没有行时也能清空）
						uploadListIns.config.elem.next()[0].value = '';
					});
					//模拟点击提交
					$('#testListAction').click(function(){
						if(isUploading){
							layer.msg('正在上传中，请稍后...', {icon: 16,shade: 0.01,time: 1000});
							return;
						}
						uploadFiles();
					});
					function uploadFiles(){
						// 获取所有上传按钮
						var uploadButtons = $('#demoList tr').find('.demo-upload').get();
						// console.log(uploadButtons);
						
						if (uploadButtons.length === 0) {
							if(isUploading){
								isUploading = false;
							}else{
								layer.msg('请先选择文件', {icon: 2});
							}
							return;
						}
						
						// 只获取第一个按钮并触发点击
						isUploading = true;
						var firstButton = uploadButtons[0];
						$(firstButton).trigger('click');
					}
					//多文件上传
					var uploadListIns = upload.render({
						elem: '#testList'     // 选择文件按钮
						,elemList: $('#demoList') //列表元素对象
						,url: '/api/index/upload' //此处用的是第三方的 http 请求演示，实际使用时改成您自己的上传接口即可。
						,accept: 'file'  //指定允许上传时校验的文件类型，可选值有：images（图片）、file（所有文件）、video（视频）、audio（音频）
						,multiple: true  //是否允许多文件上传。设置 true即可开启。不支持ie8/9
						,number: 0   //设置同时可上传的文件数量，一般配合 multiple 参数出现; 0 不限制
						,auto: false  //是否选完文件后自动上传。如果设定 false，那么需要设置 bindAction 参数来指向一个其它按钮提交上传
						// ,bindAction: '#testListAction'  //指向一个按钮触发上传，一般配合 auto: false 来使用
						,data: {
							group_id: function(){
								return $('[name="group_id"]').val();
							}
						}
						, exts: 'jpeg|jpg|png|gif|doc|docx|ppt|pptx|xls|xlsx|pdf|zip|rar|7z|txt|mp4|psd|svg' //只允许上传文件
						,choose: function(obj){   //选择文件后的回调函数。返回一个object参数
							var that = this;
							var files = this.files = obj.pushFile(); //将每次选择的文件追加到文件队列
							// console.log(files);
							//读取本地文件
							obj.preview(function(index, file, result){
								// console.log(file);
								var tr = $(['<tr id="upload-'+ index +'">'
								,'<td>'+ file.name +'</td>'
								,'<td>'+ (file.size/1014).toFixed(1) +'kb</td>'
								,'<td>等待上传</td>'
								,'<td></td>'
								,'<td><div class="layui-progress" lay-filter="progress-demo-'+ index +'"><div class="layui-progress-bar" lay-percent=""></div></div></td>'
								,'<td>'
									,'<button type="button" class="layui-btn layui-btn-xs demo-upload demo-reload layui-hide">重传</button>'
									,'<button type="button" class="layui-btn layui-btn-xs layui-btn-danger demo-delete">删除</button>'
								,'</td>'
								,'</tr>'].join(''));
								//单个重传
								tr.find('.demo-reload').on('click', function(){
									obj.upload(index, file);
								});
								//删除
								tr.find('.demo-delete').on('click', function(){
									delete files[index]; //删除对应的文件
									tr.remove();
									uploadListIns.config.elem.next()[0].value = ''; //清空 input file 值，以免删除后出现同名文件不可选
								});
								that.elemList.append(tr);
								element.render('progress'); //渲染新加的进度条组件
							});
						}
						,done: function(res, index, upload){ //成功的回调
							var that = this;
							if(res.code == 0 || res.code == 2){ //上传成功
								//直接删除这一行
								var tr = that.elemList.find('tr#upload-'+ index)
								,tds = tr.children();
								var showMsg = '<span style="color:green;">上传成功</span>'
								tds.eq(2).html(showMsg) //显示上传成功
								if(res.msg){
									if(res.code == 2){
										showMsg = '<span style="color:green;">'+res.msg+'</span>';
									}else{
										showMsg = '<span style="color:green;">'+res.msg+'，1秒后删除本条显示记录。。。</span>';
									}
								}
								tds.eq(3).html(showMsg) //显示上传成功
								// tds.eq(5).html(''); //清空操作
								tds.eq(5).find('.demo-upload').removeClass('demo-upload'); //清空可上传标识
								delete this.files[index]; //删除文件队列已经上传成功的文件
								if(res.code == 0){
									//显示完成功信息后，延时1秒后删除这一行
									setTimeout(function(){
										tr.remove();
										uploadListIns.config.elem.next()[0].value = ''; //清空 input file 值，以免删除后出现同名文件不可选
									}, 1500);
								}
								return;
							}
							this.error(index, upload, res);
						}
						,allDone: function(obj){ //多文件上传完毕后的状态回调
							// console.log(obj)
							uploadFiles()
						}
						,error: function(index, upload, res){ //错误回调
							var that = this;
							var tr = that.elemList.find('tr#upload-'+ index)
							,tds = tr.children();
							tds.eq(2).html('<span>上传失败</span>') //显示上传失败
							tds.eq(3).html('<span>原因:</span><span style="color:red;">'+res.msg+'</span>') //显示上传失败
							// tds.eq(5).find('.demo-reload').removeClass('layui-hide'); //显示重传
							tds.eq(5).find('.demo-upload').removeClass('demo-upload'); //清空可上传标识 可选择重传功能进行重传
						}
						,progress: function(n, elem, e, index){ //注意：index 参数为 layui 2.6.6 新增
							element.progress('progress-demo-'+ index, n + '%'); //执行进度条。n 即为返回的进度百分比
						}
					});
				}
				,end: function() {
					// 最终都会执行（无论哪种方式关闭）
					$('[lay-filter="webform"]').click();
				}
			});
			return;
		});

		function add_group(id,val){
			var title = '新增分组';
			if(id>0){

			}
			layer.prompt({
				title: title,
				value: val,
				yes: function(index, layero) {
					// 获取文本框输入的值
					var value = layero.find(".layui-layer-input").val();
					var pidval = $("#fileGroupId").val();
					console.log(pidval,'pidval')
					if (value!='') {
						let callback = function (e) {
							layer.msg(e.msg);
							if(e.code==0){
								location.reload();
							}
							/*
							if(id==0){
								let item='<li data-id="'+e.data+'"><i class="iconfont icon-sucaiziyuan"></i><span>'+value+'</span></li>';
								$('#group').append(item);
							}
							else{
								$('#group').find('[data-id="'+id+'"]').data('title',value).find('span').html(value);
							}
							*/
						}
						tool.post("/home/files/add_group", {id: id,pid: pidval,title: value}, callback);
						layer.close(index);
					} else {
						layer.msg('请填写分组名称');
					}
				}
			})
			// 创建一个空字符串来存储 select 下拉框的选项
			var pid=0,optionsHTML = '';
			// 使用 forEach 遍历 fileGroup 数组
			fileGroup.forEach(function(item) {
				if (id>0 && item.id == id) {
					pid = item.pid
				}
			});
			// 循环 fileGroup 数组并构建 select 下拉框的选项
			fileGroup.forEach(function(option) {
				if(id>0 && pid==option.id){
					optionsHTML += '<option selected value="' + option.id + '">' + option.title + '</option>';
				}else{
					optionsHTML += '<option value="' + option.id + '">' + option.title + '</option>';
				}
			});
			// 创建包含选项的 select 下拉框的 HTML 代码
			var selectHTML = '<div class="custom-select"><select class="layui-form-select" id="fileGroupId">' + optionsHTML + '</select></div>';
			$(".layui-layer-content").prepend(selectHTML)
		}

		// 递归函数，在每个节点及其子节点后添加要显示的图标
		function addIconsToNodes(nodes) {
			for (var i = 0; i < nodes.length; i++) {
				nodes[i].spread = false;//默认全部收起不展开
				if(nodes[i].id>0){
					nodes[i].title = '<i data-id="'+nodes[i].id+'" data-title="'+nodes[i].title+'" class="layui-icon layui-icon-more-vertical dropdown-on"></i>'+'ID:'+'-'+ nodes[i].id+nodes[i].title;
					if (nodes[i].children) {
						addIconsToNodes(nodes[i].children);
					}
				}
			}
		}

		function get_files(param){
			var loadIndex = layer.load(0);

				url:"/home/files/index",
				data:param,
				complete:function(){
					setTimeout(function(){
						layer.close(loadIndex)
					}, 200);

							elem: 'laypage',
							limit:param['limit'],

							// theme: '#FF5722', // 自定义主题色
							layout: ['prev', 'page', 'next', 'limit', 'count', 'skip'],
							curr:param['page'],

								// console.log(obj.limit); // 得到每页显示的条数
								// 首次不执行
								if(!first){
									var data = form.val('barsearchform');
									data['page'] = obj.curr;
									data['limit'] = obj.limit;
									get_files(data);
								}
							}
						});				
					
						var item=res.data,li='';
						if(item.length>0){
							for(var a=0;a<item.length;a++){
								let isurl = 0
								let downloadFileUrl = item[a].filepath
								let yuloadFileUrl = item[a].filepath
								if(item[a].ossfilepath){
									downloadFileUrl = item[a].ossfilepath
								}
								if(item[a].ossyufilepath){
									isurl = 1
									yuloadFileUrl = item[a].ossyufilepath
								}
								let image = ['jpg','jpeg','png','gif'];
								let doc = ['doc','docx','xls','xlsx','ppt','pptx','txt','pdf','zip','rar','7z'];
								let down = '<a href="'+downloadFileUrl+'" target="_blank" class="layui-btn layui-btn-xs layui-btn-normal" download="'+item[a].name+'">下载</a>';
								// 判断元素是否在数组中
								let path='/static/home/images/icon/file.png';
								if (image.includes(item[a].fileext)) {
									path=item[a].filepath;
									down = '<span data-href="'+item[a].filepath+'" class="layui-btn layui-btn-xs layui-btn-normal file-view-img">预览</span>';
								} else if (doc.includes(item[a].fileext)){
									path='/static/home/images/icon/'+item[a].fileext+'.png';
								}
								// if(item[a].fileext == 'txt'){
								// 	down = '<span data-href="'+yuloadFileUrl+'" data-isurl="'+isurl+'" class="layui-btn layui-btn-xs layui-btn-normal file-view-pdf">预览</span>';
								// }
								if(item[a].fileext == 'pdf'){
									down = '<span data-href="'+yuloadFileUrl+'" data-isurl="'+isurl+'" class="layui-btn layui-btn-xs layui-btn-normal file-view-pdf">预览</span>';
								}
								// if(item[a].fileext == 'doc' || item[a].fileext == 'docx'){
								// 	down = '<span data-href="'+yuloadFileUrl+'" data-isurl="'+isurl+'" class="layui-btn layui-btn-xs layui-btn-normal file-view-pdf">预览</span>';
								// }
								// if(item[a].fileext == 'xls' || item[a].fileext == 'xlsx'){
								// 	down = '<span data-href="'+yuloadFileUrl+'" data-isurl="'+isurl+'" class="layui-btn layui-btn-xs layui-btn-normal file-view-pdf">预览</span>';
								// }
								li+='<li data-id="'+item[a].id+'" data-title="'+item[a].name+'" data-ext="'+item[a].fileext+'"><img src="'+path+'" alt="'+item[a].filename+'" style="object-fit: contain;" class="file-item"><p title="'+item[a].name+'"><a href="'+downloadFileUrl+'" target="_blank" title="点击下载" download="'+item[a].name+'">'+item[a].name+'</a></p><div class="layui-btn-group"><span class="layui-btn layui-btn-xs file-edit">重命名</span>'+down+'<span class="layui-btn layui-btn-xs layui-btn-danger file-del">删除</span></div><div class="file-check">✔</div></li>';
							}
							$('#filesBox').html(li);
							$('#laypage').show();
						}
						else{
							$('#filesBox').html('<div class="empty"><i class="layui-icon layui-icon-upload"></i><p>无文件文件，赶紧去上传吧!</p></div>');
							$('#laypage').hide();
						}
					}	
				}				
			});
		}

		(function(){
			document.addEventListener('DOMContentLoaded', function() {
				const pcWidth = 1000; // PC端设计宽度
				const scale = window.innerWidth / pcWidth;
				document.querySelector('meta[name="viewport"]').content =

		// 图片预览函数
		function previewImage(url, title) {
			if (!url) return;
			
			if (typeof layer.photos !== 'function') {
				// 如果layer.photos不存在，使用普通的layer.open
				layer.open({
					type: 1,
					title: title || '图片预览',
					shadeClose: true,
					shade: 0.8,
					area: ['90%', '90%'],
					content: '<div style="text-align:center;padding:20px;"><img src="' + url + '" style="max-width:100%;max-height:100%;"></div>'
				});
				return;
			}
			
			// 使用LayerUI的相册预览（更专业的图片查看器）
			layer.photos({
				photos: {
					title: title || '图片预览',
					id: Math.random().toString(36).substr(2), // 随机ID
					start: 0, // 初始显示索引
					data: [{
						alt: title || '预览图片',
						pid: 1, // 图片id
						src: url, // 原图地址
						thumb: url // 缩略图地址
					}]
				},
				anim: 5, // 0-6的选择，指定弹出图片动画类型，默认随机
				shadeClose: true,
				closeBtn: 1,
				shift: 5 // 切换动画方式，默认0是左右切换，1是上下切换，2是淡入淡出，3是放大缩小，4是左到右渐变，5是上到下渐变，6是左上渐变
			});
		}
	</script>
